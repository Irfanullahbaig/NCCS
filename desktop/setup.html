<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NCCS setup</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f2744;
        color: #0f2744;
      }
      .card {
        width: min(420px, calc(100vw - 32px));
        background: #fff;
        border-radius: 20px;
        padding: 28px 24px 24px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }
      .hidden { display: none; }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: #e10600;
        color: #fff;
        font-size: 18px;
        letter-spacing: 1px;
        font-weight: 700;
      }
      h1 { margin: 0; text-align: center; font-size: 24px; }
      p { margin: 8px 0 20px; text-align: center; color: #5b6b7c; font-size: 14px; }
      label { display: block; margin: 12px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5b6b7c; }
      input {
        width: 100%;
        height: 42px;
        border: 1px solid #d7dee6;
        border-radius: 12px;
        padding: 0 12px;
        font-size: 14px;
      }
      button {
        width: 100%;
        height: 44px;
        margin-top: 20px;
        border: 0;
        border-radius: 12px;
        background: #14b8a6;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .error { min-height: 20px; margin: 10px 0 0; color: #be123c; font-size: 13px; text-align: center; }
    </style>
  </head>
  <body>
    <form class="card" id="license-form">
      <div class="mark">NCCS</div>
      <h1>Administrator license</h1>
      <p>Enter the Administrator License Key for this computer. This is required once per installation.</p>
      <label for="license">License key</label>
      <input id="license" name="license" type="password" required autocomplete="off" spellcheck="false" />
      <div class="error" id="license-error"></div>
      <button type="submit" id="license-submit">Verify key</button>
    </form>

    <form class="card hidden" id="admin-form">
      <div class="mark">NCCS</div>
      <h1>Set up this computer</h1>
      <p>Create the first administrator for this local NCCS installation. Data stays on this machine.</p>
      <label for="name">Administrator name</label>
      <input id="name" name="name" required autocomplete="name" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" />
      <div class="error" id="admin-error"></div>
      <button type="submit" id="admin-submit">Create local admin</button>
    </form>

    <script>
      const licenseForm = document.getElementById("license-form");
      const adminForm = document.getElementById("admin-form");
      const licenseError = document.getElementById("license-error");
      const adminError = document.getElementById("admin-error");
      const licenseSubmit = document.getElementById("license-submit");
      const adminSubmit = document.getElementById("admin-submit");

      function showAdmin() {
        licenseForm.classList.add("hidden");
        adminForm.classList.remove("hidden");
      }

      async function boot() {
        try {
          const state = await window.nccsDesktop.setupState();
          if (state?.licensed) showAdmin();
        } catch {
          licenseError.textContent = "Could not start setup.";
        }
      }

      licenseForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        licenseError.textContent = "";
        licenseSubmit.disabled = true;
        try {
          const result = await window.nccsDesktop.verifyLicense(document.getElementById("license").value);
          if (!result?.ok) {
            licenseError.textContent = result?.error || "Invalid license key.";
            return;
          }
          if (result.next === "setup") showAdmin();
        } catch (err) {
          licenseError.textContent = err instanceof Error ? err.message : "Invalid license key.";
        } finally {
          licenseSubmit.disabled = false;
        }
      });

      adminForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        adminError.textContent = "";
        adminSubmit.disabled = true;
        try {
          const result = await window.nccsDesktop.createAdmin({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          });
          if (!result?.ok) adminError.textContent = result?.error || "Could not create the administrator.";
        } catch (err) {
          adminError.textContent = err instanceof Error ? err.message : "Could not create the administrator.";
        } finally {
          adminSubmit.disabled = false;
        }
      });

      boot();
    </script>
  </body>
</html>
